[package]
name = "confy-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["Zero <1143967454@qq.com>"]
description = "Simple, efficient configuration loading: multi-format (TOML/YAML/JSON), layered merging, and hot reloading"
documentation = "https://docs.rs/confy-rs"
homepage = "https://github.com/zlx2019/confy-rs"
repository = "https://github.com/zlx2019/confy-rs"
readme = "README.md"
license = "MIT"
keywords = ["config", "configuration", "settings", "hot-reload", "toml"]
categories = ["config"]

[dependencies]
thiserror = "2"
serde = "1"
serde_json = "1"
toml = { version = "1", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
notify = { version = "8", optional = true }
arc-swap = { version = "1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[build-dependencies]

[features]
default = ["toml", "watch"]
# TOML file support (.toml)
toml = ["dep:toml"]
# YAML file support (.yaml / .yml)
yaml = ["dep:serde_yaml_ng"]
# File watching & hot reloading
watch = ["dep:notify", "dep:arc-swap"]

# docs.rs 构建时开启全部 feature, 保证文档完整
[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

### Working directory
[workspace]
members = []

[profile.release]

[profile.dev]
