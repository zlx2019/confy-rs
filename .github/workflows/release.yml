name: Release

# 推送 v* 标签时: 校验版本与测试 → 发布到 crates.io → 创建 GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布前守门: tag 版本必须与 Cargo.toml 一致, 且全量测试通过
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag v${tag_version} does not match Cargo.toml version ${crate_version}"
            exit 1
          fi

      - uses: taiki-e/install-action@v2.85.6
        with:
          tool: nextest
      - name: cargo nextest
        run: cargo nextest run --all-features --no-tests pass

  # 发布到 crates.io(需要在仓库 Secrets 中配置 CARGO_REGISTRY_TOKEN)
  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # crates.io 发布成功后, 生成 Changelog 并创建 GitHub Release
  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 依据 cliff.toml 生成本次发布的 Changelog
      # v3 基于 Docker 构建（基础镜像 Debian buster 已 EOL，apt 源 404），v4 改为直接下载二进制
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          # tag 检出处于 detached HEAD，无法从分支 upstream 推断仓库地址，需显式指定
          GITHUB_REPO: ${{ github.repository }}

      # 创建 GitHub Release，正文取自上一步生成的 Changelog
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          token: ${{ secrets.GITHUB_TOKEN }}
